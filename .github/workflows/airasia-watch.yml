name: AirAsia time-slot scan

on:
  schedule:
    # 马来西亚时间 = UTC+8
    - cron: "15 7 * * 2"   # 周二 15:15
    - cron: "15 10 * * 3"  # 周三 18:15
    - cron: "15 14 * * 5"  # 周五 22:15
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan AirAsia X only
        env:
          SCAN_ONLY: D7
        run: python scraper/scan.py

      - name: Compare with the latest regular scan
        run: python scraper/watch.py

      - name: Commit
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/watch.json
          git diff --cached --quiet && exit 0
          git commit -m "AirAsia slot scan $(TZ=Asia/Kuala_Lumpur date '+%F %H:%M')"
          git pull --rebase origin main
          git push

      - name: Notify cheaper fares
        if: hashFiles('data/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "AirAsia 加扫发现更便宜 $(TZ=Asia/Kuala_Lumpur date '+%-m/%-d %H:%M')" \
            --body-file data/alert.md \
            --assignee "$GITHUB_REPOSITORY_OWNER"
