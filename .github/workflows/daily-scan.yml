name: Daily flight scan

on:
  schedule:
    # 22:17 UTC = 马来西亚时间 06:17，扫描约 30–50 分钟，留出 GitHub 排队延迟，确保 8 点前更新完
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      limit_days:
        description: "测试用：只扫描前 N 天（留空=完整扫描）"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan
        env:
          SCAN_LIMIT_DAYS: ${{ inputs.limit_days }}
        run: python scraper/scan.py

      - name: Build page data
        run: python scraper/build.py

      - name: Commit
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily scan $(TZ=Asia/Kuala_Lumpur date +%F)"
          git push
